[alembic]
script_location = migrations
prepend_sys_path = .

# Version files are named 0001_..., 0002_... so that `ls` sorts them in apply
# order. Alembic's own ordering comes from down_revision, not the filename —
# the numbering is for humans reading the directory.
file_template = %%(rev)s_%%(slug)s

# The URL is resolved in migrations/env.py from MIGRATION_DATABASE_URL (the
# OWNER role), deliberately not from DATABASE_URL (the runtime role, which
# cannot create tables and should not be able to). Left blank here so there is
# no credential in a tracked file and no second place for the URL to drift.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
